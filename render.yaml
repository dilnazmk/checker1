services:
  - type: web
    name: checker-api
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: checker-db
          property: connectionString

databases:
  - name: checker-db
    databaseName: checker
    user: checker
    plan: free
